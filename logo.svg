<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <!-- Parlak Cyan - Mor Gradyan -->
    <linearGradient id="centeredDGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8" />
      <stop offset="100%" style="stop-color:#6366f1" />
    </linearGradient>

    <filter id="perfectGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Koyu Şık Arka Plan -->
  <rect width="220" height="220" rx="44" fill="#0b0f19"/>

  <!-- ==================== GİRDİ / ÇIKTI HATTLARI ==================== -->
  <!-- A Girdisi -->
  <line x1="20" y1="80" x2="58" y2="80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="20" cy="80" r="5" fill="#38bdf8"/>

  <!-- B Girdisi -->
  <line x1="20" y1="140" x2="58" y2="140" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="20" cy="140" r="5" fill="#38bdf8"/>

  <!-- Y Çıktısı -->
  <line x1="172" y1="110" x2="200" y2="110" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="110" r="6" fill="#38bdf8" filter="url(#perfectGlow)"/>

  <!-- ==================== ANA BÜYÜK D HARFİ GÖVDESİ ==================== -->
  <path d="M 58 46 
           L 118 46 
           A 64 64 0 0 1 118 174 
           L 58 174 
           Z" 
        fill="#131b2e" 
        stroke="url(#centeredDGrad)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#perfectGlow)"/>

  <!-- ==================== TAM ORTALANMIŞ İÇ D ÇEKİRDEĞİ (CONCENTRIC CENTERED D) ==================== -->
  <!-- Tam Hizanlanmış İç D Çerçevesi -->
  <path d="M 88 78 
           L 114 78 
           A 32 32 0 0 1 114 142 
           L 88 142 
           Z" 
        fill="none" 
        stroke="url(#centeredDGrad)" 
        stroke-width="4" 
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Çip Çentiği (Notch) -->
  <circle cx="96" cy="87" r="2.5" fill="#38bdf8"/>

  <!-- Tam Merkezdeki Çip Çekirdek Noktası (Visual Center Node: x=110, y=110) -->
  <circle cx="110" cy="110" r="5" fill="#38bdf8" filter="url(#perfectGlow)"/>
</svg>
